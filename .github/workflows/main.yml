name: Test

on:
  workflow_dispatch:
    inputs:
      config:
          description: 'kernel config target'
          required: true
          default: 'vendor/akari.config'
      ksu_config:
          description: 'kernel config target'
          required: true
          default: 'vendor/ksu.config'          
      kernelname:
          description: 'Kernel name'
          required: true
          default: 'Teletubies'


jobs:
  build:
    runs-on: ubuntu-latest

    env:
      TZ: Asia/Jakarta
      CONFIG: ${{ github.event.inputs.config }}
      KERNELNAME: ${{ github.event.inputs.kernelname }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        
      - name: ReSukiSU Setup
        run: |
          curl -LSs "https://raw.githubusercontent.com/KOWX712/KernelSU/refs/heads/master/kernel/setup.sh" | bash -s master
      - name: Patch Kernelsu
        run: |
          curl -LSs "https://raw.githubusercontent.com/JackA1ltman/NonGKI_Kernel_Build_2nd/refs/heads/mainline/Patches/syscall_hook_patches.sh" | bash -s
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc bison flex libssl-dev build-essential \
            gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi \
            gcc-arm-linux-gnueabihf python3 aria2 cpio
      - name: Clone Neutron Clang 24
        run: |
          mkdir -p clang && cd clang
          curl -LO "https://raw.githubusercontent.com/Neutron-Toolchains/antman/main/antman"
          chmod a+x antman
          ./antman -S
          ./antman --patch=glibc
      # 4. Set environment variables
      - name: Export build vars
        run: |
          export KERNEL_DIR=$PWD
          export CLANG_PATH=$PWD/clang/bin
          echo "PATH=$CLANG_PATH:/usr/bin:$PATH" >> $GITHUB_ENV
          echo "KERNEL_DIR=$KERNEL_DIR" >> $GITHUB_ENV
      - name: Start kernel build
        run: |
          export PATH="$PATH"
          export ARCH=arm64
          export SUBARCH=arm64
          export CLANG_TRIPLE=aarch64-linux-gnu-
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-
          export CC=clang
          export LD=ld.lld
          export AR=llvm-ar
          export NM=llvm-nm
          export OBJCOPY=llvm-objcopy
          export OBJDUMP=llvm-objdump
          export STRIP=llvm-strip
          export LLVM=1
          export LLVM_IAS=1
          export KBUILD_BUILD_USER=malkist
          export KBUILD_BUILD_HOST=android
          mkdir -p out
          make O=out vendor/msm8953-perf_defconfig $KSU_CONFIG $CONFIG
          make -j$(nproc --all) O=out \
      - name: Clone Anykernel3
        run: |
          git clone --depth=1 https://github.com/malkist02/anykernel3 -b main AnyKernel3 
          cp out/arch/arm64/boot/Image.gz-dtb AnyKernel3/Image.gz-dtb
          cd AnyKernel3
          zip -r "../Teletubies-K4.19-mido-${{ env.BUILD_TIME }}.zip" *
      - name: Upload Flashable zip
        uses: actions/upload-artifact@vvariable with:
        name: Teletubies-K4.19-mido-${{ env.BUILD_TIME }}
        path: AnyKernel3/*
